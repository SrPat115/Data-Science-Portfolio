<!doctype html>

<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ site.title }}</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    line-height: 1.6;
    color: #222;
    background: #fff;
  }

  .wrapper {
    display: flex;
    min-height: 100vh;
  }

  header {
    width: 260px;
    padding: 40px 30px;
    border-right: 1px solid #ddd;
  }

  header h1 {
    margin-top: 0;
    margin-bottom: 5px;
  }

  header > p {
    margin-top: 0;
  }

  nav h3 {
    margin-top: 30px;
    margin-bottom: 10px;
  }

  nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  nav li {
    margin-bottom: 8px;
  }

  nav a {
    text-decoration: none;
  }

  nav a:hover {
    text-decoration: underline;
  }

  section {
    flex: 1;
    max-width: 850px;
    padding: 40px 60px;
  }

  section h1 {
    margin-top: 0;
  }

  @media (max-width: 700px) {
    .wrapper {
      flex-direction: column;
    }

    header {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid #ddd;
    }

    section {
      padding: 30px;
    }
  }
</style>
</head>

<body>
  <div class="wrapper">

```
<header>
  <h1>{{ site.title }}</h1>

  <p>{{ site.description }}</p>

  <nav>

  <li><a href="{{ '/projects.html' | relative_url }}">Projects</a></li>
  <li><a href="{{ '/blog.html' | relative_url }}">Writing</a></li>
</ul>

<h3>Connect</h3>

<ul>
  <li>Resume</li>
  <li><a href="YOUR-LINKEDIN-URL-HERE">LinkedIn</a></li>
</ul>
```

  </nav>
</header>


<section>
  {{ content }}
</section>
```

  </div>
</body>
</html>
